[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "featlens"
version = "0.3.3"
description = "Model-agnostic feature-map visualization: PCA, cosine-similarity, k-means and foreground maps from any vision model and any layer."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Turhan Can Kargin" }]
keywords = ["feature-maps", "visualization", "pca", "vision-transformer", "interpretability", "dino", "clip", "vjepa"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=1.13",
    "torchvision>=0.14",
    "numpy>=1.21",
    "pillow>=9.0",
    "imageio>=2.20",
    "einops>=0.6",
    "matplotlib>=3.5",
    "pyyaml>=5.4",
]

[project.optional-dependencies]
timm = ["timm>=0.9"]
hf = ["transformers>=4.30"]
clip = ["open_clip_torch>=2.20"]
all = ["timm>=0.9", "transformers>=4.30", "open_clip_torch>=2.20", "imageio>=2.30", "imageio-ffmpeg>=0.4"]
demo = ["gradio>=4.0"]
video = ["imageio>=2.30", "imageio-ffmpeg>=0.4"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.24"]

[project.scripts]
featlens = "featlens.cli:main"

[project.urls]
Homepage = "https://github.com/turhancan97/FeatLens"
Documentation = "https://turhancan97.github.io/FeatLens/"

[tool.setuptools.packages.find]
include = ["featlens*"]
