name: JOSS draft PDF

# Builds paper/paper.md into a PDF with the Open Journals toolchain whenever the paper changes.
# The PDF is attached to the workflow run under "Artifacts".
on:
  push:
    paths:
      - "paper/**"
      - ".github/workflows/draft-pdf.yml"

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper draft
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/paper.pdf
