name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Smoke tests (CPU, ${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Run every combination even if one fails, so a run shows the full compatibility picture.
      fail-fast: false
      matrix:
        # Every supported Python version on Linux...
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # ...plus one version on macOS and Windows to catch OS-specific problems (paths, I/O).
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU-only PyTorch + timm)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[timm]" pytest
      - name: Show versions
        run: python -c "import sys, torch, numpy, timm; print(sys.version); print('torch', torch.__version__, '| numpy', numpy.__version__, '| timm', timm.__version__)"
      - name: Run smoke tests
        run: pytest tests/ -q
